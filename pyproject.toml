[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bitelevate-pr-review-copilot"
version = "0.1.0"
description = "AI first-pass pull request review copilot for Cynbit BitElevate interns with strict human mentor approval"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Cynbit Technologies", email = "engineering@cynbit.com" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.8.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.28.0",
    "openai>=1.65.0",
    "jinja2>=3.1.5",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
